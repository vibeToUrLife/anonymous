<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
  <title>🌍 Pet World</title>
  <script src="../../src/js/maintenance.js"></script>
  <script>if(localStorage.getItem('access_code_verified')!=='true'){document.documentElement.style.display='none';window.location.replace('../../index.html');}</script>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@400;600;700;800&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="css/world.css?v=w10" />

  <!-- i18n first: everything below renders text through T(). The language is
       chosen in index.html's settings; this page only reads it. -->
  <script src="../../src/js/i18n.js?v=3"></script>
  <script src="../../src/js/i18n-zh-app.js?v=5"></script>
  <script src="js/world-i18n-zh.js?v=1"></script>
  <script defer src="../../src/js/i18n-ui.js?v=3"></script>

  <!-- Firebase (compat 10.12.0) — same versions as room.html, plus Realtime Database for live sync -->
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-app-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-auth-compat.js"></script>
  <script defer src="https://www.gstatic.com/firebasejs/10.12.0/firebase-database-compat.js"></script>
  <script defer src="../../src/js/firebase-config.js?v=w2"></script>
  <!-- Share-to-board helper (defines window.ShareToBoard) for the 📢 Share button. -->
  <script defer src="../../src/js/share-to-board.js?v=1"></script>
  <!-- 摸鱼时长 tracker: counts time spent in Pet World toward rooms/{uid}.totalStaySec
       (the 摸鱼榜). Self-contained; polls for the default Firebase app world-core inits. -->
  <script defer src="../../src/js/stay-time.js?v=2"></script>

  <!-- Reused pet art (pure) + accessory renderer (declaration-only, safe standalone) -->
  <script defer src="../pets/shared.js?v=w2"></script>
  <script defer src="../pets/cat.js?v=w2"></script>
  <script defer src="../pets/dog.js?v=w2"></script>
  <script defer src="../pets/bunny.js?v=w2"></script>
  <script defer src="../pets/hamster.js?v=w2"></script>
  <script defer src="../pets/fox.js?v=w2"></script>
  <script defer src="../pets/panda.js?v=w2"></script>
  <script defer src="../pets/goose.js?v=w2"></script>
  <script defer src="../pets/tom.js?v=w2"></script>
  <script defer src="../pets/jerry.js?v=w2"></script>
  <script defer src="../room/js/room-accessories.js?v=w3"></script>

  <!-- World modules (core LAST so every dependency is defined) -->
  <script defer src="js/world-pet-data.js?v=w3"></script>
  <script defer src="js/world-config.js?v=w14"></script>
  <script defer src="js/world-logic.js?v=w6"></script>
  <script defer src="js/world-moderation.js?v=w2"></script>
  <script defer src="js/world-actions.js?v=w3"></script>
  <script defer src="js/world-input.js?v=w5"></script>
  <script defer src="js/world-net.js?v=w6"></script>
  <script defer src="js/world-actors.js?v=w4"></script>
  <script defer src="js/world-sparkles.js?v=w2"></script>
  <script defer src="js/world-reactive.js?v=w2"></script>
  <script defer src="js/world-ball.js?v=w4"></script>
  <script defer src="js/world-critters.js?v=w2"></script>
  <script defer src="js/world-sky.js?v=w1"></script>
  <script defer src="js/world-fireflies.js?v=w1"></script>
  <script defer src="js/world-notes.js?v=w7"></script>
  <script defer src="js/world-chat.js?v=w4"></script>
  <script defer src="js/world-outfit.js?v=w4"></script>
  <script defer src="js/world-scene-pool.js?v=w2"></script>
  <script defer src="js/world-scene-egypt.js?v=w2"></script>
  <script defer src="js/world-scene-grassland.js?v=w2"></script>
  <script defer src="js/world-core.js?v=w17"></script>
</head>
<body>
  <div id="worldStage">
    <canvas id="worldCanvas"></canvas>
    <div id="worldTagLayer"></div>
  </div>

  <div id="worldTopbar">
    <a class="world-back" href="../room.html" data-i18n-title title="Back to room">←</a>
    <div id="worldSceneName" data-i18n>🌍 Pet World</div>
    <div class="world-top-actions">
      <button id="worldPetBtn" data-i18n>🐾 Pet</button>
      <button id="worldWearBtn" data-i18n>👕 Wear</button>
      <button id="worldShareBtn" data-i18n-title title="Share this world to the bubble board" data-i18n>📢 Share</button>
    </div>
  </div>

  <div id="worldSceneTabs"></div>
  <div id="worldStatus" class="world-status warn" data-i18n>🔴 connecting…</div>
  <div id="worldSparkleChip" class="world-status" hidden>✨ 0/0</div>

  <div id="worldJoystick"></div>
  <div id="worldActionBtns"></div>
  <button id="worldHighfiveBack" hidden data-i18n>✋ High-five back!</button>
  <!-- The label sits beside the key chip: data-i18n assigns textContent, so
       marking the button would delete the chip — the label gets its own span.
       The chip prints the keyboard key's OWN name and stays as-is (the app
       dictionary already reads 'Enter' as the access-code button, "进入"), the
       same way 'Close (Esc)' keeps its Esc. -->
  <button id="worldNotePrompt" hidden><span data-i18n>📋 Open board</span><span class="world-note-key">Enter</span></button>

  <div id="worldBoardModal" hidden>
    <div class="world-board-frame">
      <div class="world-board-head">
        <span id="worldBoardTitle" data-i18n>📋 Notes Board</span>
        <button id="worldBoardClose" data-i18n-aria-label aria-label="Close board">✕</button>
      </div>
      <div id="worldBoardGrid"></div>
      <div class="world-board-foot">
        <div id="worldBoardPager"></div>
        <div class="world-board-write">
          <input id="worldBoardInput" maxlength="80" autocomplete="off" data-i18n-placeholder placeholder="Write a note for the board… 🌸" />
          <button id="worldBoardAdd" data-i18n>📌 Pin</button>
        </div>
        <div id="worldBoardMsg"></div>
      </div>
    </div>
  </div>

  <div id="worldChat" class="collapsed">
    <button id="worldChatToggle" data-i18n-aria-label aria-label="Toggle chat">
      <span id="worldChatToggleLabel" data-i18n>💬 Chat</span>
      <span id="worldChatUnread" hidden></span>
    </button>
    <div id="worldChatPanel">
      <div id="worldChatLog"></div>
      <div id="worldChatRow">
        <input id="worldChatInput" maxlength="100" autocomplete="off" data-i18n-placeholder placeholder="Say hi… (be kind 🌸)" />
        <button id="worldChatSend" data-i18n-title title="Send">➤</button>
      </div>
    </div>
  </div>
  <div id="worldChatHint"></div>

  <div id="worldMenu" data-pane="pet">
    <button id="worldMenuClose">✕</button>
    <div id="worldPetPane"><h3 data-i18n>🐾 Choose your pet</h3><div id="worldPetPicker"></div></div>
    <div id="worldWearPane" style="display:none"><h3 data-i18n>👕 Change your outfit</h3><div id="worldWardrobe"></div></div>
  </div>

  <div id="worldGate">
    <h1 data-i18n>🌍 Pet World</h1>
    <p data-i18n>Please open the World from inside the app so we know who you are.</p>
    <a href="../../index.html" data-i18n>Go to the app</a>
  </div>
</body>
</html>
